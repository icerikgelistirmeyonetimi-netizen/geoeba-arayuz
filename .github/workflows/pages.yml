name: GitHub Pages

# Statik site: derleme yok, yalnız yayınlanacak dosyalar kopyalanır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Yayınlanacak dosyaları hazırla
        run: |
          mkdir _site
          cp -r index.html ilkokul.html ortaokul.html lise.html grade-urls.js .nojekyll css js assets vendor _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
