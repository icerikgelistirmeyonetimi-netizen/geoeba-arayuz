      setTimeout(function () {
        if (window.adalarBasladi) return;
        if (location.protocol === 'file:') {
          document.querySelector('.yedek-mesaj').textContent =
            'Sayfa doğrudan dosyadan açıldı. Klasörü yerel bir sunucuyla açın: python -m http.server 5180 --directory matematik-adalar-3d';

    });
